# The OpenAPI route operator: CRD, namespaced RBAC, and the manager Deployment in flights-lab,
# from the module's own config (src/openapi-route-operator/config/default). Apply after
# k8s/flights (which owns the namespace); remove with KUBECTL.md "Removing the exercise".
#
# The image is pinned by digest. After `make docker-push` in the module, update it with:
#   cd k8s/operator && ../../src/openapi-route-operator/bin/kustomize edit set image \
#     controller=$(cat ../../src/openapi-route-operator/bin/image)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../src/openapi-route-operator/config/default
images:
- digest: sha256:e3ed1da8e806046a83b7731c1fed4db263bb4be85f26eb804d5a5f61558d22d3
  name: controller
  newName: us-central1-docker.pkg.dev/dev1-486920/operator-lab/openapi-route-operator
