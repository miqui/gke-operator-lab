      labels: { app: flight-command }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.6-alpine
          command: ["nginx", "-c", "/etc/fixture/nginx.conf", "-g", "daemon off;"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /etc/fixture/nginx.conf, subPath: flight-command.conf }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          configMap: { name: flight-fixtures-nginx }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flight-command
  namespace: flights-lab
spec:
  selector: { app: flight-command }
  ports:
    - { name: http, port: 8080, targetPort: http }
