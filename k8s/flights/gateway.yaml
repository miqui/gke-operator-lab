# The exercise Gateway. Its proxy Service is ClusterIP (GatewayClass flights-envoy ->
# EnvoyProxy flights-clusterip), reached only through a loopback port-forward. Routes attach
# only from this namespace; the operator generates them.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flights
  namespace: flights-lab
spec:
  gatewayClassName: flights-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: flights.example.test
      allowedRoutes:
        namespaces:
          from: Same
---
# Path handling the operator's matches rely on. By default Envoy merges duplicate slashes, so
# /flights//status would become /flights/status and match getFlight's template; encoded
# slashes (%2F) could likewise smuggle an extra segment past [^/]+. Both are refused instead.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: flights-paths
  namespace: flights-lab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: flights
  path:
    disableMergeSlashes: true
    escapedSlashesAction: RejectRequest
