# k8s/platform/: Crossplane's GCP provider family + functions + credentials config.
# Needs the CRDs from the crossplane Application (previous wave); inside, its own sync waves put
# the Crossplane packages before the objects whose CRDs they install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/miqui/gke-operator-lab.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # The ClusterProviderConfig can race the provider's CRD installation on a first sync.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
