# Values for the `external-secrets/external-secrets` chart 2.11.0, rendered by
# k8s/argocd/apps/external-secrets.yaml.

installCRDs: true

serviceAccount:
  create: true
  # Fixed name: gke-deploy.sh binds external-secrets/external-secrets to the external-secrets
  # GCP service account, which gke-secrets-seed.sh grants secretAccessor on exactly the
  # configured secrets. Future SecretStore resources can use this ambient identity
  # without providing credentials of their own.
  name: external-secrets
  annotations:
    iam.gke.io/gcp-service-account: external-secrets@dev1-486920.iam.gserviceaccount.com

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
