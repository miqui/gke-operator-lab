# Kyverno policies (policies.kyverno.io/v1 CEL types - ClusterPolicy is deprecated).
#   rules/                    shared rule bodies, unscoped
#   overlays/enforce-default  rules -> Deny, `default` namespace
#   overlays/audit-other      rules -> Audit, `headlamp` + `polaris`
#   audit-only/               rules that only ever audit
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - overlays/enforce-default
  - overlays/audit-other
  - audit-only
