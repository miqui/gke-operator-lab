# Crossplane packages. Only the GCP provider family is installed: it owns the ProviderConfig CRDs
# (so crossplane-provider-config.yaml has a kind to apply) but manages no GCP resources itself.
# Each sub-provider (provider-gcp-storage, ...) is a separate pod with its own CRDs; add one here,
# at the same version as the family, with `runtimeConfigRef: {name: provider-gcp}` when the
# platform first needs it. Pinned to exact versions so a sync never upgrades anything by surprise.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-gcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-family-gcp:v3.0.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
